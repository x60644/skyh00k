name: skyh00k daily

on:
  schedule:
    - cron: '37 13 * * *'   # 9:37 AM ET (13:37 UTC) — audit yesterday, build today
    - cron: '41 21 * * *'   # 5:41 PM ET — slate refresh (picks up late lines/rosters)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore play-by-play cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: skyh00k-pbp-${{ github.run_id }}
          restore-keys: |
            skyh00k-pbp-

      - name: Install dependencies
        run: pip install nba_api pandas supabase

      - name: Audit yesterday (tolerant — skips if nothing to grade)
        working-directory: data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python audit_slate.py || true

      - name: Build today's WNBA slate
        working-directory: data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python build_slate.py

      - name: Commit results
        run: |
          git config user.name "skyh00k-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/public/slate.json data/slates data/audit_log.csv || true
          git diff --cached --quiet || git commit -m "auto: slate + audit $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
